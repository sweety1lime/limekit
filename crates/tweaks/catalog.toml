description.ru = "Заголовки окон и их границы окрашиваются в цвет акцента из Параметров."
description.en = "Window title bars and borders take the accent color from Settings."
provenance = "observed"
notify = "ImmersiveColorSet"

[tweak.requires]
verified = [19045]

