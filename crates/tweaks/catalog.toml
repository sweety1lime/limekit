title.en = "No window and menu animations"
description.ru = "Окна, меню и подсказки появляются сразу, без плавного раскрытия и затухания. В «Параметрах быстродействия» Windows это «Особые эффекты» со снятыми галочками анимации, кроме анимации панели задач."
description.en = "Windows, menus and tooltips appear at once, without sliding or fading. In Windows' Performance Options this is “Custom” with the animation boxes cleared, except for taskbar animations."
# The flags are documented SystemParametersInfo parameters. VisualFXSetting is
# not documented: it is what Performance Options writes when boxes are cleared
