# The tweak catalog built into LimeKit. Each tweak is data: what it writes when
# turned on and off, where the values come from, and which Windows it is for.
# `cargo test -p tweaks` checks the rules below (src/catalog.rs).
#
# id           category.name; the journal refers to tweaks by it, so it stays.
#              The window groups tweaks by category in catalog order.
# provenance   documented   Microsoft documents the value; cite it in source.
#              observed     undocumented, but what Windows' own settings write.
#              unsupported  a trick Windows does not support and may drop.
# takes_effect immediately | new_windows | explorer_restart | sign_out
# notify       the WM_SETTINGCHANGE area to announce after a switch, as
#              Windows' own settings do, so open windows pick the change up.
# path, name   a key under HKEY_CURRENT_USER, without the hive, and a value.
# parameter    instead of path and name: a system parameter set through
#              SystemParametersInfo or the shell's own settings call, on and
#              off as DWORD 1 and 0. A tweak for one of the four shell
#              settings lists the registry value and the parameter: File
#              Explorer keeps both, and its Folder Options dialog undoes a
#              change made to only one of them.
# on / off     a value such as { type = "dword", data = 1 }, or "delete".
#              off is the Windows default.
# missing      what Windows goes by while the value does not exist yet.
# requires     min_build, below_build ("26100" or "26100.3915"), editions
#              (home, pro, enterprise, education, server), verified = [builds
#              it was checked on], native_since + settings_uri when Windows
#              has its own switch for it from that build on.
#
# A tweak counts as verified on a build only after someone has turned it on
# and off there and seen it work. Until then LimeKit says it is unverified,
# and takes_effect is the cautious guess.

# --- File Explorer ------------------------------------------------------------

[[tweak]]
id = "explorer.file_extensions"
title.ru = "Показывать расширения файлов"
title.en = "Show file name extensions"
description.ru = "Проводник показывает расширения у всех файлов, например .exe или .txt. Так сложнее выдать программу «документ.pdf.exe» за документ."
description.en = "File Explorer shows every file's extension, such as .exe or .txt, which makes a program named “document.pdf.exe” harder to pass off as a document."
provenance = "observed"
takes_effect = "new_windows"

[tweak.requires]
verified = [19045]

[[tweak.change]]
path = 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
name = "HideFileExt"
on = { type = "dword", data = 0 }
off = { type = "dword", data = 1 }
missing = { type = "dword", data = 1 }

[[tweak.change]]
parameter = "show_extensions"
on = { type = "dword", data = 1 }
off = { type = "dword", data = 0 }

