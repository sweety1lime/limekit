on = { type = "dword", data = 0 }
off = { type = "dword", data = 1 }
missing = { type = "dword", data = 1 }

[[tweak]]
id = "appearance.dark_system"
title.ru = "Тёмные панель задач и «Пуск»"
title.en = "Dark taskbar and Start"
description.ru = "Панель задач, меню «Пуск» и центр уведомлений становятся тёмными. В Windows 10 они тёмные по умолчанию, поэтому твик только для Windows 11."
description.en = "The taskbar, Start and the notification center turn dark. Windows 10 has them dark by default, so this tweak is for Windows 11 only."
provenance = "observed"
notify = "ImmersiveColorSet"

[tweak.requires]
min_build = 22000

[[tweak.change]]
path = 'Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
name = "SystemUsesLightTheme"
on = { type = "dword", data = 0 }
off = { type = "dword", data = 1 }
missing = { type = "dword", data = 1 }

[[tweak]]
id = "appearance.accent_taskbar"
title.ru = "Цвет акцента на панели задач и в «Пуске»"
title.en = "Accent color on the taskbar and Start"
description.ru = "Панель задач, «Пуск» и центр уведомлений окрашиваются в цвет акцента из Параметров. Работает, когда Windows в тёмном режиме."
description.en = "The taskbar, Start and the notification center take the accent color from Settings. It works when Windows is in dark mode."
provenance = "observed"
notify = "ImmersiveColorSet"

[tweak.requires]
verified = [19045]

[[tweak.change]]
path = 'Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
name = "ColorPrevalence"
on = { type = "dword", data = 1 }
off = { type = "dword", data = 0 }
missing = { type = "dword", data = 0 }

[[tweak]]
id = "appearance.accent_titlebars"
