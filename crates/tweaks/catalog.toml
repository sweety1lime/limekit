id = "privacy.search_history"
title.ru = "Не хранить историю поиска на этом компьютере"
title.en = "Don't keep search history on this PC"
description.ru = "Windows перестаёт сохранять на этом компьютере историю твоих запросов в поиске."
description.en = "Windows stops saving your search queries on this PC."
provenance = "observed"

[tweak.requires]
min_build = 18362
verified = [19045]

[[tweak.change]]
