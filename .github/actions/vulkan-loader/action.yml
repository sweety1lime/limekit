name: Vulkan loader
description: >
  Builds the Khronos Vulkan loader from a pinned tag. libmpv-2.dll and
  ffmpeg.exe import vulkan-1.dll; a desktop gets it with the GPU driver, a
  hosted runner has no GPU driver, so without it neither loads. Steps that need
  it append the output directory to PATH, which comes after System32 in the DLL
  search order, so the build under test stays exactly as shipped.

outputs:
  dir:
    description: Windows path of the directory holding vulkan-1.dll
    value: ${{ steps.build.outputs.dir }}

runs:
  using: composite
  steps:
    - id: build
      shell: bash
      env:
        TAG: vulkan-sdk-1.4.363.0
        COMMIT: fa218055ff4948b159f31d43f800c808a13d51df
      run: |
        dir="$RUNNER_TEMP/vulkan-loader"
        git clone --quiet --depth 1 --branch "$TAG" https://github.com/KhronosGroup/Vulkan-Loader "$dir/src"
        if [ "$(git -C "$dir/src" rev-parse HEAD)" != "$COMMIT" ]; then
          echo "::error::$TAG no longer points at $COMMIT"
          exit 1
        fi
        cmake -S "$dir/src" -B "$dir/build" -D UPDATE_DEPS=ON
        cmake --build "$dir/build" --config Release
        mkdir -p "$dir/bin"
        cp "$dir/build/loader/Release/vulkan-1.dll" "$dir/bin/"
        echo "dir=$(cygpath -w "$dir/bin")" >> "$GITHUB_OUTPUT"
