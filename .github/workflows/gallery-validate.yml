name: gallery-validate

# Validates catalog changes on any PR (and push) touching the gallery. This is
# the automated moderation gate: structure + policy checks before human review.
# Media re-encoding is still done by the pack author (`renderer pack --reencode`),
# not here — see docs/research/catalog.md.

on:
  pull_request:
    paths: ["gallery/**"]
  push:
    paths: ["gallery/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Catalog is generated from the packs (checksums honest)
        run: |
          node gallery/build-catalog.mjs
          git diff --exit-code gallery/catalog.json \
            || { echo "::error::catalog.json is stale — run: node gallery/build-catalog.mjs"; exit 1; }
      - name: Validate catalog.json
        run: node gallery/validate.mjs
      - name: Catalog signature (when signing is enabled)
        run: node gallery/verify-signature.mjs
