name: build

# Every push and pull request: format, lint, tests, the portable build, and a
# smoke test of the resulting zip on two Windows images. A v* tag also attests
# the build and its SBOM and opens a draft release to review and publish by
# hand. A manual run attests too but creates no release, so that path can be
# tried before a real tag.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Builds that get attested (tags and manual runs) start from nothing: a
  # restored cache could carry whatever an earlier run left in it into them.
  RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 75
    permissions:
      contents: read
    defaults:
      run:
        # bash stops at the first failing command; a multi-line pwsh step only
        # reports the exit code of its last one.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # zizmor cannot evaluate RELEASE_BUILD, so it flags both caches below as
      # reachable from a release build. They are not.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
          cache: ${{ env.RELEASE_BUILD != 'true' && 'npm' || '' }} # zizmor: ignore[cache-poisoning]
          cache-dependency-path: apps/ui/package-lock.json

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.RELEASE_BUILD != 'true' # zizmor: ignore[cache-poisoning]
        with:
          workspaces: |
            . -> target
            apps/ui/src-tauri -> target

      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked --version 0.7.7

      - name: Fetch libmpv, ffmpeg and license texts
        shell: pwsh
        run: |
          ./scripts/fetch-libmpv.ps1
          ./scripts/fetch-ffmpeg.ps1
          ./scripts/fetch-licenses.ps1

      - name: Install frontend dependencies
        working-directory: apps/ui
        run: npm ci

      # The libmpv test loads the real DLL, which needs vulkan-1.dll.
      - id: vulkan
        uses: ./.github/actions/vulkan-loader

      - name: Format
        run: |
          cargo fmt --all -- --check
          (cd apps/ui/src-tauri && cargo fmt --all -- --check)

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          (cd apps/ui/src-tauri && cargo clippy --workspace --all-targets --locked -- -D warnings)

      - name: Type check
        working-directory: apps/ui
        run: npx tsc --noEmit

      - name: Tests
        env:
          VULKAN_DIR: ${{ steps.vulkan.outputs.dir }}
        run: |
          export PATH="$PATH:$(cygpath -u "$VULKAN_DIR")"
          cargo test --workspace --locked
          # The UI's end-to-end daemon test starts target/debug/renderer.exe
          # and skips itself when it is missing, which cargo test alone leaves.
          cargo build -p renderer --locked
          (cd apps/ui/src-tauri && cargo test --workspace --locked)

      - name: Portable build
        shell: pwsh
        run: ./scripts/build-portable.ps1 -Auditable

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: limekit-portable
          path: |
            dist/LimeKit-*-win64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Server 2022 shares the Windows 10/11 21H2 shell; Server 2025 is build
        # 26100, the same base as Windows 11 24H2. Neither is a desktop Windows,
        # so this is a signal, not a substitute for testing on Windows 11.
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: limekit-portable
          path: dist

      - name: Checksums
        shell: bash
        working-directory: dist
        run: grep -- "-win64.zip" SHA256SUMS.txt | sha256sum -c

      - name: Unpack
        shell: pwsh
        run: Expand-Archive (Get-Item dist/LimeKit-*-win64.zip) -DestinationPath unpacked

      - id: vulkan
        uses: ./.github/actions/vulkan-loader

      - name: Smoke test
        shell: pwsh
        env:
          VULKAN_DIR: ${{ steps.vulkan.outputs.dir }}
        run: |
          $env:PATH += ";$env:VULKAN_DIR"
          ./scripts/smoke-test.ps1 -Dir unpacked/LimeKit

  release:
    needs: [build, smoke]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the draft release, created on tags only
      id-token: write # the Sigstore certificate behind the attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: limekit-portable
          path: dist

      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          unzip -q "dist/LimeKit-$version-win64.zip" -d unpacked

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: unpacked/LimeKit
          format: spdx-json
          output-file: dist/LimeKit-${{ steps.version.outputs.version }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # One provenance attestation covering the zip and the three programs
      # inside it, so `gh attestation verify` works on an unpacked .exe too.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/LimeKit-${{ steps.version.outputs.version }}-win64.zip
          sbom-path: dist/LimeKit-${{ steps.version.outputs.version }}-sbom.spdx.json

      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh attestation verify "dist/LimeKit-$VERSION-win64.zip" --repo "$GITHUB_REPOSITORY"

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match version $VERSION in Cargo.toml"
            exit 1
          fi
          notes="packaging/release-notes-$VERSION.md"
          if ! grep -q '^<сюда вывод из' "$notes"; then
            echo "::error::$notes is missing or has no checksum placeholder"
            exit 1
          fi
          tr -d '\r' < "$notes" |
            awk -v sums="$(cat dist/SHA256SUMS.txt)" '/^<сюда вывод из/ {print sums; next} {print}' > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "LimeKit $VERSION" --notes-file notes.md \
            "dist/LimeKit-$VERSION-win64.zip" dist/SHA256SUMS.txt \
            "dist/LimeKit-$VERSION-sbom.spdx.json"
